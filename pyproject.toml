[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rag-pgvector-hybrid"
version = "0.1.0"
description = "Hybrid RAG on Postgres + pgvector: vector and full-text search fused with RRF, a numeric guardrail on LLM answers, retrieval evals in CI."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Rodrigo Hermont Ozon" }]
dependencies = [
    "psycopg[binary]>=3.2",
    "pgvector>=0.3",
    "numpy>=1.26",
    "fastapi>=0.110",
    "uvicorn>=0.29",
]

[project.optional-dependencies]
llm = ["anthropic>=0.40"]
embed = ["fastembed>=0.4"]
dev = ["pytest>=8", "httpx>=0.27"]

[tool.setuptools]
packages = ["rag"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["pg: needs a Postgres with pgvector (DATABASE_URL)"]
