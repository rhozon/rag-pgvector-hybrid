name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: rag
          POSTGRES_PASSWORD: rag
          POSTGRES_DB: rag
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U rag"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://rag:rag@localhost:5432/rag
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -e ".[dev,embed]"
      - name: Unit and Postgres integration tests
        run: pytest -v
      - name: Retrieval eval, hash embedder (lexical baseline)
        run: |
          python -m rag.cli ingest data/handbook --reset
          python -m rag.cli eval --k 1
          python -m rag.cli eval --k 3 --min-hit 0.8
      - name: Retrieval eval, bge-small-en-v1.5 (semantic)
        env:
          EMBEDDER: fastembed
        run: |
          python -m rag.cli ingest data/handbook --reset
          python -m rag.cli eval --k 1
          python -m rag.cli eval --k 3 --min-hit 0.8
